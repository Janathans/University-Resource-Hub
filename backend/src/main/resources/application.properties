spring.application.name=university-resource-hub

# Database Configuration (Supabase PostgreSQL - Direct Connection)
spring.datasource.url=jdbc:postgresql://db.gxuzrxequnqibkdcfhma.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Janathan2003140
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate properties
# 'update' will create tables if they don't exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Ensure it uses the public schema
spring.jpa.properties.hibernate.default_schema=public

# Enhanced Logging for Debugging Schema Creation
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Server port
server.port=8080
